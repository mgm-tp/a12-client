  <title
     id="t">Client overview</title>
  <desc
     id="d">Client works on an Application Model, which describes the application's modules, flows, scenes, and
		menus, or on a Dynamic Configuration, the code-first and currently experimental alternative; either one describes
		the UI structure and the interaction behavior, and is an input to the process shown. The diagram shows the browser
		process of an A12 client application, with Client running inside it
		alongside the Engines and Widgets it orchestrates. Client's own parts, drawn as four white boxes, are Application
		Setup, which bootstraps the runtime and composes it with an Application Model or a Dynamic Configuration; the Redux
		store and Activities, which hold the Activity Descriptor, DataHolders, and loading state of each use case and drive
		the Activity, Scene, and View cascade with its replay algorithm; the Application Frame, Regions, and Views, where a
		provider mechanism maps names to UI components and a layout renders the views assigned to a region; and the
		ModuleRegistry and its extensions, the pluggable extension points for project or third-party code. In the same
		process, drawn as blue boxes, run the A12 libraries: the Kernel, used for Document Model navigation
		and for evaluating validation and computation rules; Data Services, used for document and query access; Widgets,
		used for the field, layout, and other UI widgets shown inside a view; the Engines, which Client orchestrates by rendering them
		inside the Views it assigns to Regions; and the foundation libraries Base and Utils,
		used as a connector, localization, and logging layer. Also in the same process, drawn as grey boxes, run the
		third-party libraries React, Redux, and Redux-Saga. Below them, drawn as a dashed amber box, is the project's own
		code: its Application Model or Dynamic Configuration modules, custom widgets, and business logic. Outside the
		process boundary, reached through Data Services and the Kernel, is the Backend, which supplies documents and
		models. The diagram shows composition and context only; it does not show which part calls which.</desc>
