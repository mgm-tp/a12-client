  Overview diagram for the A12 Client introduction — see the a12-docs-component-introduction
  skill's references/diagram-conventions.md for the conventions this file follows.

  Embedded from documentation/src/0100_introduction.adoc as:
    image::assets/images/overview/client-overview.svg[...]

  This diagram is deliberately container-level only (composition and context, no internal call
  flow). It complements — and does not duplicate — documentation/src/0501_walkthrough.adoc, whose
  own client-architecture.svg already shows the module-level Activity/Scene/View mechanism in
  detail (component-team input: that diagram may be outdated — see draft-notes.md in the
  a12-docs-component-introduction skill's scratch output for this intro).
-->

