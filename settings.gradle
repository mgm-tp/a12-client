rootProject.name = 'client'

dependencyResolutionManagement {
    versionCatalogs {
        if (file('gradle/a12-internal.versions.toml').exists()) {
            create('a12Internal') {
                from(files('gradle/a12-internal.versions.toml'))
            }
        }
    }
}

include ':coreTestModels', ':devappModels', ':devappServices',
    'appmodel-migration', 'codemod', 'core', 'data', 'devapp', 'documentation'

['security', 'docker'].each { name ->
    if (file(name).exists()) {
        include(name)
    }
}

project(':coreTestModels').projectDir = file('core/resources/testModels')
project(':devappModels').projectDir = file('devapp/resources/models')
project(':devappServices').projectDir = file('devapp/resources/server')
