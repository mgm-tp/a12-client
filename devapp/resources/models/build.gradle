buildscript {
    configurations.classpath {
        // both dataservices and kernel provide groovy 3.x (org.codehaus.groovy) dependencies, while we want groovy 4.x (org.apache.groovy)
        resolutionStrategy.capabilitiesResolution.withCapability('org.codehaus.groovy:groovy') {
            selectHighestVersion()
        }
    }

    dependencies {
        classpath platform(libs.dataservices.bom)
        classpath libs.dataservices.modelgraph
        classpath libs.kernel.md.facade
    }
}

import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    alias(libs.plugins.prepare.models)
}

prepareModels {
    generateValidationCode = true
}

tasks.named('jar') {
    enabled = false
}

tasks.register('_clean', Delete) {
    delete layout.buildDirectory
    delete prepareModels.outputDir
}

tasks.named('clean') {
    dependsOn tasks.named('_clean')
}

tasks.register('generateModelGraph', JavaExec) {
    dependsOn tasks.named('prepareModels')

    final String dir = prepareModels.outputDir.asFile.get().toString()
    // The model graph lives inside the devapp source tree and is imported as a module
    // so rsbuild watches and bundles it.
    // The generator writes in place, which briefly truncates the file; rsbuild's watcher
    // then races on the empty file and fails the build for a moment. To avoid that, write
    // to a temp file in the build dir and atomically move it into place afterwards, so
    // rsbuild only ever observes a complete file.
    final File finalFile = file("../../src/devapp/mocks/modelGraph/model_graph_mock.json")
    final File tmpFile = layout.buildDirectory.file("modelGraph/model_graph_mock.json").get().asFile

    classpath = buildscript.configurations.classpath
    mainClass = 'com.mgmtp.a12.dataservices.modelgraph.fs.impl.ModelGraphGenerator'

    inputs.dir(prepareModels.outputDir)
    outputs.file(finalFile)

    args("--output=${tmpFile}")

    // models are copied into one directory as the generator class can only handle a "single" input
    args(dir)

    doFirst {
        tmpFile.parentFile.mkdirs()
    }

    doLast {
        Files.move(
            tmpFile.toPath(),
            finalFile.toPath(),
            StandardCopyOption.REPLACE_EXISTING,
            StandardCopyOption.ATOMIC_MOVE
        )
    }

    description = 'Generates the modelgraph used for mock mode and tests. Re-run this after changes to resources/models.'
    group = 'development'
}

tasks.named('assemble') {
    dependsOn tasks.named('generateModelGraph')
}
