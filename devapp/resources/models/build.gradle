buildscript {
    configurations.classpath {
        // both dataservices and kernel provide groovy 3.x (org.codehaus.groovy) dependencies, while we want groovy 4.x (org.apache.groovy)
        resolutionStrategy.capabilitiesResolution.withCapability('org.codehaus.groovy:groovy') {
            selectHighestVersion()
        }
    }

    dependencies {
        classpath platform(libs.dataservices.bom)
        classpath libs.dataservices.core.tooling
        classpath libs.kernel.md.model
        classpath libs.kernel.md.facade
        classpath libs.kernel.migration
    }
}

plugins {
    alias(libs.plugins.prepare.models)
}

tasks.named('jar') {
    enabled = false
}

tasks.register('generateModelGraph', JavaExec) {
    dependsOn tasks.named('prepareModels')

    final String dir = prepareModels.outputDir.asFile.get().toString()
    final String modelGraphFilePath = "../../src/devapp/mocks/modelGraph/model_graph_mock.json"

    classpath = buildscript.configurations.classpath
    mainClass = 'com.mgmtp.a12.dataservices.tooling.modelgraph.ModelGraphGenerator'

    inputs.dir(prepareModels.outputDir)
    outputs.file(modelGraphFilePath)

    args("--output=${modelGraphFilePath}")

    // models are copied into one directory as the generator class can only handle a "single" input
    args(dir)

    description = 'Generates the modelgraph used for mock mode and tests. Re-run this after changes to resources/models.'
    group = 'development'
}


tasks.named('assemble') {
    dependsOn tasks.named('generateModelGraph')
}
