import groovy.json.JsonSlurper
import groovy.yaml.YamlSlurper

project.buildscript.dependencies {
    classpath 'org.apache.groovy:groovy-yaml:4.0.28'
}

// Determine dataservices version from package.json for a standalone build
// or the pnpm-workspace.yaml for the monorepo build
def getVersionFromNodeDependency = { String dependency ->
    String versionFromPackageJson = new JsonSlurper()
        .parse(new File(projectDir, '../../package.json'))
        .dependencies[dependency]
    return !versionFromPackageJson.contains('catalog')
        ? versionFromPackageJson
        : new YamlSlurper().parse(rootProject.file("pnpm-workspace.yaml"))
        .catalogs.a12[dependency]
}

ext.dataServicesVersion = getVersionFromNodeDependency('@com.mgmtp.a12.dataservices/dataservices-access')

// Add the dataservices BOM to buildscript classpath to resolve A12 dependency versions
// but also the Spring Boot plugin version
project.buildscript.dependencies {
    classpath platform("com.mgmtp.a12.dataservices:dataservices-parent:$dataServicesVersion")
}