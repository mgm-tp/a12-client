buildscript {
    dependencies {
        classpath platform(libs.dataservices.bom)
        classpath 'org.springframework.boot:spring-boot-gradle-plugin'
    }
}

plugins {
    id 'java'
}

// Apply the spring boot plugin with the version resolved in the buildscript dependencies
apply plugin: 'org.springframework.boot'

dependencies {
    implementation platform(libs.dataservices.bom)
    implementation libs.dataservices.server.app
}

springBoot {
    mainClass = 'com.mgmtp.a12.dataservices.server.app.ServerApplication'
}

bootJar {
    archiveBaseName = 'devapp'

    from('../models/src') {
        include '**/*.json'
        into '/BOOT-INF/classes/com/mgmtp/a12/platform/business-models'
    }

    from('../rpcRequests') {
        include '*.json'
        into '/BOOT-INF/classes/com/mgmtp/a12/services/import/requests'
    }

    includeEmptyDirs = false

    from('../../dist') {
        include '**'
        into '/BOOT-INF/classes/META-INF/resources/app'
    }
}

tasks.register("runJar", JavaExec) {
    dependsOn tasks.named('bootJar')

    workingDir = new File("${projectDir.path}/../../")

    systemProperty 'server.port', '9090'
    systemProperty 'server.data.location', './target/server/data'

    mainClass = '-jar'
    args bootJar.archiveFile.get().toString()
}
