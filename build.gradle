buildscript {
    dependencies {
        classpath libs.build.utilities
    }
}

plugins {
    alias(libs.plugins.spotless)
    alias(libs.plugins.version.catalog.update)
    alias(libs.plugins.integration)
}

import com.mgmtp.a12.devtools.gradle.plugins.buildutils.Helper
import com.mgmtp.a12.devtools.gradle.plugins.buildutils.tasks.LeadingBuildTask
import com.mgmtp.a12.devtools.gradle.plugins.buildutils.tasks.PackageJsonModifierTask
import groovy.json.JsonSlurper
import groovy.yaml.YamlSlurper
import nl.littlerobots.vcu.plugin.resolver.VersionSelectors

import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.Paths

/** Define a proper version in build */
String globalVersion = Helper.getVersion(
    providers,
    layout.projectDirectory.file('package.json'),
    project.findProperty('version') as String,
    project.findProperty('use') as String
)

allprojects {
    apply plugin: 'base'

    version = globalVersion

    tasks.register("deploy") {}

    // TODO A12-19152: remove once dataservices ships a release pinning jsonrpc4j 2.0.0.
    // The dataservices 39.0.x BOM constrains com.mgmtp.a12.jsonrpc4j:jsonrpc4j to the
    // pre-release 2.0.0-dev.0, which was removed from artifactory on 2026-08-01, so any
    // build with a cold cache fails to resolve. 2.0.0 is the published release of the
    // same code and declares identical dependencies.
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'com.mgmtp.a12.jsonrpc4j'
                && details.requested.name == 'jsonrpc4j'
                && details.requested.version == '2.0.0-dev.0') {
                details.useVersion '2.0.0'
                details.because 'A12-19152: 2.0.0-dev.0 is not published; 2.0.0 is the released equivalent'
            }
        }
    }
}

if (file('publish/build.gradle').exists()) {
    apply from: 'publish/build.gradle'
}

spotless {
    format 'asciidoc', {
        target fileTree('documentation/src') { include '**/*.adoc' }
        licenseHeaderFile(rootProject.file('license_header.txt'), '^[=\\[]')
        // transform C-style header to asciidoc block comments
        replaceRegex 'Convert C-style block start to asciidoc block comment start', '^/\\*', '////'
        replaceRegex 'Convert C-style block end to asciidoc block comment end', '^ \\*/', '////\n'
        replaceRegex 'Remove asterisk prefixes', '^ \\* ?', ''
    }
}

tasks.register('configurePnpm', LeadingBuildTask) {
    final String requiredPnpmVersion = pnpmVersion
    final Path installDir = Paths.get("${rootDir}/.npm")

    doLast {
        if (System.getenv('CI')) {
            println "Installing $requiredPnpmVersion"

            Files.createDirectories(installDir)

            execCommandLine 'npm', 'install', '-g', '--prefix', installDir.toString(), requiredPnpmVersion
        } else {
            def os = System.getProperty('os.name').toLowerCase()
            def pnpmCommand = os.contains('win') ? 'where pnpm' : 'which pnpm'
            def result = pnpmCommand.execute().text.trim()

            if (result) {
                println "pnpm is available at: $result"
            } else {
                throw new GradleException("pnpm is not installed on your system. Please install with 'npm install -g $requiredPnpmVersion'")
            }
        }
    }
}

String getPnpmVersion() {
    return (new JsonSlurper().parse(file("package.json"))["packageManager"] as String).split("\\+")[0]
}

tasks.register('pnpmInstall', LeadingBuildTask) {
    dependsOn tasks.named('configurePnpm')
    mustRunAfter tasks.named('setVersion')
    doLast { execCommandLine 'pnpm', 'install' }
}

tasks.register('verify', LeadingBuildTask) {
    dependsOn tasks.named('pnpmInstall')
    // the type-aware rules read sibling declarations out of `lib`, which `_assemble`
    // produces; without them cross-package types resolve to `error` and the
    // `no-unsafe-*` family reports findings that are not there
    mustRunAfter tasks.named('_assemble')
    doLast { execCommandLine 'node', '--run', 'verify' }
}

tasks.register('_clean', LeadingBuildTask) {
    dependsOn tasks.named('pnpmInstall')
    doLast { execCommandLine 'node', '--run', 'clean' }
}

tasks.named('clean') {
    dependsOn tasks.named('_clean')
}

tasks.register('_assemble', LeadingBuildTask) {
    dependsOn tasks.named('pnpmInstall'),
        project(':coreTestModels').tasks.named('assemble'),
        project(':devappModels').tasks.named('assemble')
    // the devapp bundle bakes the version in at build time and package.json is not stamped
    // until publish, so the value has to come from gradle
    doLast { execCommandLine(['node', '--run', 'build']) { environment 'RELEASE_VERSION', globalVersion } }
}

tasks.named('assemble') {
    dependsOn tasks.named('_assemble')
}

tasks.register('_check', LeadingBuildTask) {
    dependsOn tasks.named('pnpmInstall')
    // The JS tests run from `lib` and read generated model fixtures from
    // `core/target/models`, both produced by `_assemble`. Ordering only, so a bare
    // `check` does not pull in a frontend build the way `dependsOn` would.
    mustRunAfter tasks.named('_assemble'), tasks.named('verify')

    doLast {
        // react-dom only ships `act` in its development bundle, and the integration
        // job exports NODE_ENV=production, so the suite has to force `test` itself.
        execCommandLine(['node', '--run', 'test']) {
            environment 'NODE_ENV', 'test'
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('_check'), tasks.named('verify')
}

// review builds resolve to the plain -SNAPSHOT version, so stamping would rewrite all
// workspace package.json files to what they already contain
final boolean stampVersion = project.hasProperty('use')

tasks.register('setVersion', PackageJsonModifierTask) {
    onlyIf { stampVersion }
    packageDirs = new YamlSlurper().parse(file('./pnpm-workspace.yaml')).packages
        .collect({ file(it) }) + file('.')
    change = Helper.createSetVersion(version as String)
}

versionCatalogUpdate {
    sortByKey = false
    versionSelector {
        VersionSelectors.PREFER_STABLE.select(it) && !it.candidate.version.contains('SNAPSHOT')
    }
}
