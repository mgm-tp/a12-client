buildscript {
    dependencies {
        classpath platform(libs.dataservices.bom)
        classpath libs.kernel.md.model
        classpath libs.kernel.md.facade
        classpath libs.kernel.migration
    }
}

plugins {
    alias(libs.plugins.prepare.models)
}

tasks.register('cleanTestModels', Delete) {
    delete layout.buildDirectory
    delete layout.projectDirectory.dir('../../target/models')
}

tasks.named('clean') {
    dependsOn tasks.named('cleanTestModels')
}

tasks.named('assemble') {
    dependsOn tasks.named('prepareModels')
}

tasks.named('jar') {
    enabled = false
}
