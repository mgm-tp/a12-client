packages:
  - "appmodel-migration"
  - "core"
  - "data"
  - "devapp"
  - "documentation"
  - "codemod"

catalogs:

  # all a12 dependencies should be listed here (regardless of how many workspaces use them)
  # this is done to have a single "entry point" for upgrading a12
  a12:
    "@com.mgmtp.a12.base/base-model-api": ^29.3.0
    "@com.mgmtp.a12.dataservices/dataservices-access": ^38.4.0
    "@com.mgmtp.a12.devtools/build-tools": 1.1.0
    "@com.mgmtp.a12.devtools/codemod": ^2.1.0
    "@com.mgmtp.a12.devtools/docu": ^0.1.0
    "@com.mgmtp.a12.devtools/react": ^0.2.0
    "@com.mgmtp.a12.devtools/tsconfig": ^1.1.0
    "@com.mgmtp.a12.devtools/why-did-you-render": ^2.1.0
    "@com.mgmtp.a12.kernel/kernel-core-runtime-api-ts": ^30.8.1
    "@com.mgmtp.a12.kernel/kernel-md-facade": ^30.8.1
    "@com.mgmtp.a12.migrationtool/migrationtool-core": ^2.1.1
    "@com.mgmtp.a12.migrationtool/migrationtool-utils": ^2.1.1
    "@com.mgmtp.a12.utils/utils-collections": ^6.2.0
    "@com.mgmtp.a12.utils/utils-connector": ^8.2.0
    "@com.mgmtp.a12.utils/utils-localization": ^7.2.0
    "@com.mgmtp.a12.utils/utils-localization-react": ^7.2.0
    "@com.mgmtp.a12.utils/utils-logging": ^6.2.0
    "@com.mgmtp.a12.widgets/widgets-core": ^38.3.0

  default:
    "@jambit/eslint-plugin-typed-redux-saga": ^0.4.0
    "@tony.ganchev/eslint-plugin-header": ^3.4.4
    "@microsoft/api-extractor": ^7.58.9
    "@redux-devtools/extension": ^4.0.0
    "@rsbuild/core": ^2.1.7
    "@rsbuild/plugin-react": ^2.1.0
    "@rsdoctor/rspack-plugin": ^1.6.1
    "@testing-library/dom": ^10.4.1
    "@testing-library/react": ^16.3.2
    "@testing-library/user-event": ^14.6.1
    "@types/lodash.merge": ^4.6.9
    "@types/mocha": ^10.0.10
    "@types/node": ^26.1.1
    "@types/react-dom": ^19.2.3
    "@types/react-redux": ^7.1.34
    "@types/react": ^19.2.17
    "@types/semver": ^7.7.1
    "@types/source-map-support": ^0.5.10
    c8: ^12.0.0
    concurrently: ^10.0.3
    cspell: ^10.0.1
    eslint-plugin-use-effect-no-deps: ^1.1.2
    eslint-plugin-workspaces: ^0.12.1
    fast-deep-equal: ^3.1.3
    fp-ts: ^2.16.11
    global-jsdom: ^29.0.0
    jsdom: ^29.1.1
    lodash.merge: ^4.6.2
    mocha: ^11.7.6
    monocle-ts: ^2.3.13
    oxfmt: ^0.66.0
    oxlint: ^1.83.0
    oxlint-tsgolint: ^7.0.2001
    react-dnd: ^16.0.1
    react-dom: ^19.2.6
    react-redux: ^7.2.2
    react: ^19.2.6
    redux-saga-test-plan: ^4.0.6
    redux-saga: ^1.5.1
    redux: ^4.0.5
    semver: ^7.8.5
    smol-toml: ^1.7.0
    source-map-loader: ^5.0.0
    source-map-support: ^0.5.21
    styled-components: ^6.4.3
    ts-morph: ^27.0.2
    # update to 1.5.0 was skipped (https://github.com/agiledigital/typed-redux-saga/issues/677)
    typed-redux-saga: 1.3.1
    typedoc: ^0.28.20
    typedoc-plugin-missing-exports: ^4.1.2
    typescript: ^5.9.3
    typescript-fsa: ^3.0.0
    yaml: ^2.9.0

  # ranges we publish as peerDependencies where our own install (in "default")
  # is pinned to a different version
  peers:
    # our build stays on 1.3.1 because of the type-inference regression in 1.5
    # (see the pin in "default"); it is type-only, so consumers may run 1.5.x
    typed-redux-saga: ^1.3.1

# do not allow any postinstall scripts
permissions:
  core-js:
    build: false
  esbuild:
    build: false

# cleanup unused catalog entries during install
catalogPrune: true

# no cycles between workspace dependencies
disallowWorkspaceCycles: true

# enforce version constraints from package.json
engineStrict: true

# when using "--filter", check that the filter applies to some package
failIfNoMatch: true

# do not check git status when publishing
gitChecks: false

# CI sets this to warn by default
loglevel: info

# prevent pnpm >10 from self-upgrading,
# since it doesn't use the global node_modules as target
pmOnFail: ignore

# enforce new packages to be at least 1 week old, except our own
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@com.mgmtp.a12.*/*'

overrides:
  # widgets-core allows ^3.3.3, which resolves below the GHSA-55q2-fjhq-7xh7 fix
  dompurify@3: ^3.4.17
  # ajv allows ^3.0.1, which resolves below the GHSA-w74x-v6f9-j3xg fix
  fast-uri@3: ^3.1.9

# allow conflicting peer dependencies for A12 packages
peerDependencyRules:
  allowAny:
    - "@com.mgmtp.a12.*/*"
  allowedVersions:
    "react-redux>react": "^19"

# ensure latest deps are installed when updating for audit
resolutionMode: highest

# force pnpm to fail on missing or conflicting peer dependencies
strictPeerDependencies: true

# (for now), only trusted authors can change the lockfile
trustLockfile: true

# do not install packages where trust level decreased
trustPolicy: no-downgrade

# 90d - only police recent publishes; older provenance gaps predate npm attestations
trustPolicyIgnoreAfter: 129600

# before "pnpm run" calls, checks if node_modules are up-to-date
# (e.g. after rebasing / checking out a branch and forgetting "pnpm install")
verifyDepsBeforeRun: warn

auditConfig:
  ignoreGhsas:
    # deepmerge mergeObject() prototype poisoning, pulled in transitively via
    # @com.mgmtp.a12.widgets/widgets-core. No patched deepmerge version exists yet.
    - GHSA-gcqx-w48m-w2h4
    # minimatch globparts amplification DoS, via ts-morph (codemod) and glob
    # (migrationtool-core). The only fixed minimatch is 11.x, outside the ^10 range
    # both require.
    - GHSA-g3hv-75wg-m249
    # glob AbortSignal cancellation bypass, via @com.mgmtp.a12.migrationtool/migrationtool-core,
    # which requires glob ^13. The first fixed glob is 14.0.2.
    - GHSA-3g3m-2fjr-6pw4
